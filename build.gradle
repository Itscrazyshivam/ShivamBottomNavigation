plugins {
    id 'com.android.library' version '8.7.3'
    id 'maven-publish'
}

group = 'com.github.Itscrazyshivam'
version = '1.0.0'

android {
    namespace 'com.shivam.bottomnavigation'
    compileSdk 37

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Itscrazyshivam'
                artifactId = 'ShivamBottomNavigation'
                version = '1.0.0'
            }
        }
    }
}
